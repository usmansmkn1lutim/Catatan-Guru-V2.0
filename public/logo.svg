<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bookGradLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="bookGradRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>
    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f3f4f6" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#4c1d95" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Transparent Background - NO container / NO bingkai background box -->

  <g filter="url(#dropShadow)">
    <!-- Back Cover - Left -->
    <path d="M 64 128 C 140 100, 230 116, 256 136 L 256 388 C 230 368, 140 352, 64 380 Z" fill="url(#bookGradLeft)" />
    <!-- Back Cover - Right -->
    <path d="M 448 128 C 372 100, 282 116, 256 136 L 256 388 C 282 368, 372 352, 448 380 Z" fill="url(#bookGradRight)" />

    <!-- Pages Layer 1 (Under pages) -->
    <path d="M 76 122 C 146 96, 228 112, 252 130 L 252 374 C 228 356, 146 340, 76 366 Z" fill="#e5e7eb" opacity="0.7" />
    <path d="M 436 122 C 366 96, 284 112, 260 130 L 260 374 C 284 356, 366 340, 436 366 Z" fill="#d1d5db" opacity="0.7" />

    <!-- Main Front Pages - Left -->
    <path d="M 88 116 C 152 92, 226 108, 250 124 L 250 362 C 226 346, 152 330, 88 354 Z" fill="url(#pageGrad)" />
    <!-- Main Front Pages - Right -->
    <path d="M 424 116 C 360 92, 286 108, 262 124 L 262 362 C 286 346, 360 330, 424 354 Z" fill="url(#pageGrad)" />

    <!-- Book Spine Glow Center line -->
    <path d="M 256 124 L 256 372" stroke="#a78bfa" stroke-width="4" stroke-linecap="round" />

    <!-- Gold Bookmark Ribbon -->
    <path d="M 280 120 L 280 270 L 300 250 L 320 270 L 320 120 Z" fill="url(#goldRibbon)" />

    <!-- Subtle Page Lines - Left -->
    <path d="M 124 172 C 160 158, 204 166, 224 174" stroke="#c084fc" stroke-width="4" stroke-linecap="round" opacity="0.6" />
    <path d="M 116 216 C 156 202, 204 210, 224 218" stroke="#c084fc" stroke-width="4" stroke-linecap="round" opacity="0.6" />
    <path d="M 124 260 C 160 246, 204 254, 224 262" stroke="#c084fc" stroke-width="4" stroke-linecap="round" opacity="0.6" />
    <path d="M 132 304 C 164 292, 204 298, 224 304" stroke="#c084fc" stroke-width="4" stroke-linecap="round" opacity="0.6" />

    <!-- Subtle Page Lines - Right -->
    <path d="M 388 172 C 352 158, 308 166, 288 174" stroke="#a78bfa" stroke-width="4" stroke-linecap="round" opacity="0.6" />
    <path d="M 396 216 C 356 202, 308 210, 288 218" stroke="#a78bfa" stroke-width="4" stroke-linecap="round" opacity="0.6" />
    <path d="M 388 260 C 352 246, 308 254, 288 262" stroke="#a78bfa" stroke-width="4" stroke-linecap="round" opacity="0.6" />

    <!-- Sparkle / Star of Inspiration Top Right -->
    <path d="M 390 60 L 396 78 L 414 84 L 396 90 L 390 108 L 384 90 L 366 84 L 384 78 Z" fill="#fbbf24" opacity="0.9" />
    <path d="M 140 68 L 143 78 L 153 81 L 143 84 L 140 94 L 137 84 L 127 81 L 137 78 Z" fill="#a78bfa" opacity="0.8" />
  </g>
</svg>
